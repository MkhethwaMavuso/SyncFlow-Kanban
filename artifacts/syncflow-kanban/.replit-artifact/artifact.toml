kind = "web"
previewPath = "/"
title = "SyncFlow Kanban"
description = "A collaborative Kanban workspace for distributed teams to plan work, coordinate live board updates, manage sprints, and track delivery."
version = "1.0.0"
id = "artifacts/syncflow-kanban"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22740

[services.development]
run = "pnpm --filter @workspace/syncflow-kanban run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/syncflow-kanban", "run", "build" ]
serve = "static"
publicDir = "artifacts/syncflow-kanban/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22740"
BASE_PATH = "/"
